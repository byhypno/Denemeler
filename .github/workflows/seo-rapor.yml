name: SEO günlük rapor

on:
  schedule:
    - cron: "17 4 * * *"   # her gün 07:17 (Türkiye saati)
  workflow_dispatch: {}     # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r seo_rapor/requirements.txt
      - name: Raporu üret
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RAPOR_ALICI: ${{ secrets.RAPOR_ALICI }}
        run: python seo_rapor/rapor.py
      - name: Veriyi ve raporu depoya kaydet
        run: |
          git config user.name "seo-rapor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo_rapor/veri seo_rapor/raporlar
          git diff --cached --quiet || git commit -m "SEO raporu $(date +%F)"
          git push
