{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block baslik %}Cari Program{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'defter/css/cari.css' %}">
</head>
<body>
<header class="ust">
  <span class="marka">Cari Program</span>
  <nav>
    <a href="{% url 'dashboard' %}" class="{% if sayfa == 'dashboard' %}aktif{% endif %}">Genel Bakış</a>
    <a href="{% url 'odeme_listesi' %}" class="{% if sayfa == 'odemeler' %}aktif{% endif %}">Ödeme Listesi</a>
    <a href="{% url 'ek_depo' %}" class="{% if sayfa == 'ekler' %}aktif{% endif %}">Ekler</a>
    <a href="{% url 'kasa' %}" class="{% if sayfa == 'kasa' %}aktif{% endif %}">Kasa</a>
    <a href="{% url 'mutabakat_liste' %}" class="{% if sayfa == 'mutabakat' %}aktif{% endif %}">Ekstre Mutabakatı</a>
    <a href="{% url 'admin:index' %}">Veri Girişi (Yönetim)</a>
  </nav>
  <span class="sag">{{ request.user.get_username }} · <a href="{% url 'admin:logout' %}">Çıkış</a></span>
</header>
<main>
  {% for m in messages %}<div class="mesaj {{ m.tags }}" role="status">{{ m }}</div>{% endfor %}
  {% block icerik %}{% endblock %}
</main>
</body>
</html>
